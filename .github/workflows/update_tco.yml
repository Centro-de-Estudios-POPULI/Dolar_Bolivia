name: "Actualizar Tipo de Cambio Oficial (TCO)"

on:
  schedule:
    # El TCO rige el día hábil SIGUIENTE a la sesión que lo fija. El BCB publica el
    # reporte de MAÑANA al cierre de la sesión (~20:00 BOT) y lo deja estático hasta
    # el cierre siguiente; durante la mañana ese mismo reporte es el TCO que rige
    # HOY y se va finalizando. Por eso disparamos en dos franjas clave, con varios
    # intentos cercanos para sortear el WAF 403 y los retrasos de publicación del
    # BCB. El scraper es idempotente + upsert: las corridas extra no duplican,
    # refrescan al valor de cierre y solo commitean si los datos cambian. El
    # endpoint "serie de tiempo" del BCB devuelve TODA la serie por rango, así que
    # cada corrida baja el histórico completo y un día que se pierda se AUTO-RECUPERA
    # en la siguiente corrida que sí pase el WAF (ya no hay pérdida por día suelto).
    #
    #
    # ⚠ POR QUÉ DISPARAMOS ANTES Y ESPERAMOS DENTRO DEL JOB (jul-2026).
    # Las 20:05 BOT son las 00:05 UTC: la ventana MÁS congestionada de GitHub
    # Actions, porque medio mundo agenda `0 0 * * *`. GitHub no garantiza
    # puntualidad en `schedule` y descarta corridas bajo carga. Medido: el bloque
    # de la tarde (00:05–01:30 UTC) no aterrizaba nunca y el TCO terminaba
    # capturándose recién ~23:30 BOT por la red de seguridad. Es decir, entre las
    # 20:00 y las 23:30 el panel mostraba "pendiente" con el dato ya publicado.
    # Solución sin servicios externos: disparar a una hora poco cargada y con
    # minuto NO redondo, y dormir dentro del job hasta las 20:05 BOT exactas.
    # El repo es público -> minutos de Actions gratis, la espera no cuesta nada.
    #
    # ── Tarde/noche · captura el TCO de MAÑANA apenas se publica (~20:00 BOT) ──
    - cron: "17 23 * * *"  # 19:17 BOT · espera dentro del job hasta las 20:05 BOT
    - cron: "38 0 * * *"   # 20:38 BOT (reintento)
    - cron: "23 1 * * *"   # 21:23 BOT (reintento)
    - cron: "7 3 * * *"    # 23:07 BOT (red de seguridad nocturna)
    # ── Mañana · confirma/finaliza el TCO VIGENTE de hoy (antes de las 12:00) ──
    # Minutos no redondos por el mismo motivo: las horas en punto se retrasaban
    # entre 1 y 2 horas y media.
    - cron: "19 12 * * *"  # 08:19 BOT
    - cron: "7 15 * * *"   # 11:07 BOT
    - cron: "52 15 * * *"  # 11:52 BOT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tco:
    runs-on: ubuntu-latest

    steps:
      # Espera hasta las 20:05 BOT (00:05 UTC) sólo si el disparo fue programado y
      # todavía no pasó esa hora. Si GitHub nos arrancó tarde —o si alguien lanzó
      # el workflow a mano— no espera nada y corre de inmediato.
      - name: Esperar al cierre de la sesión (20:05 BOT)
        if: github.event_name == 'schedule'
        run: |
          objetivo=$(date -u -d 'tomorrow 00:05' +%s)
          ahora=$(date -u +%s)
          espera=$(( objetivo - ahora ))
          # >2 h significa que el objetivo ya pasó hoy y 'tomorrow' apunta un día
          # de más: en ese caso corremos ya, sin dormir.
          if [ "$espera" -gt 0 ] && [ "$espera" -le 7200 ]; then
            echo "Ahora $(date -u +%H:%M) UTC · durmiendo ${espera}s hasta las 00:05 UTC (20:05 BOT)"
            sleep "$espera"
          else
            echo "Sin espera (faltan ${espera}s): se ejecuta de inmediato."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper TCO
        run: python scripts/scrape_tco.py

      - name: Commit y push si hay datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Solo commiteamos cuando cambian los datos reales (CSV / raw). El
          # tco.json se regenera con timestamp nuevo en cada corrida, así que se
          # adjunta SOLO cuando ya hay un cambio de datos (evita commits de ruido).
          git add data/tco.csv data/tco_bancos.csv data/tco_raw
          if git diff --cached --quiet; then
            echo "Sin datos nuevos de TCO."
          else
            git add data/tco.json
            git commit -m "datos: TCO $(date -u +%Y-%m-%d)"
            # El workflow del dólar puede pushear a main a la vez; si el push es
            # rechazado, hacemos rebase sobre origin/main y reintentamos.
            for i in 1 2 3 4 5; do
              if git push; then ok=1; break; fi
              echo "push rechazado (intento $i); rebase y reintento..."
              git pull --rebase origin main || git rebase --abort
              sleep 3
            done
            [ "${ok:-0}" = 1 ] || { echo "push falló tras reintentos"; exit 1; }
          fi
