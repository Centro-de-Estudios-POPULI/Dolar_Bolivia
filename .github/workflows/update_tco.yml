name: "Actualizar Tipo de Cambio Oficial (TCO)"

on:
  schedule:
    # El TCO de una sesión rige desde el día siguiente. El scraper es idempotente +
    # upsert y cada corrida baja la serie COMPLETA: las corridas extra no duplican
    # y un día que se pierda (WAF 403, atraso del BCB) se AUTO-RECUPERA en la
    # siguiente que pase.
    #
    # ⚠ LA HORA DE PUBLICACIÓN CAMBIÓ (medido en los logs de 70 corridas y con una
    # sonda cada 4 min el 29-sep-2026). Hasta la sesión del 24-sep el BCB publicaba
    # antes de las ~21:30 BOT; desde la del 25-sep —el mismo día en que el TCO pasó
    # a ser la mediana— la sesión NO está a las 21:38 ni a las 22:40 y aparece entre
    # las ~22:45 y la 01:30 BOT. Los disparos se corrieron a esa franja y queda uno
    # a las 20:38 por si el BCB vuelve al horario viejo.
    #
    # Minutos NO redondos a propósito: las horas en punto (sobre todo 00:00 UTC)
    # son las más congestionadas de Actions y GitHub las atrasa 1–2 h o las
    # descarta. Los tiempos reales llegan con ~30–90 min de atraso igual.
    # ── Noche · captura la sesión del día apenas se publica ──
    - cron: "38 0 * * *"   # 20:38 BOT (por si vuelve el horario viejo)
    - cron: "53 2 * * *"   # 22:53 BOT
    - cron: "37 4 * * *"   # 00:37 BOT
    - cron: "43 5 * * *"   # 01:43 BOT
    - cron: "13 7 * * *"   # 03:13 BOT (red de seguridad nocturna)
    # ── Mañana · confirma el TCO que rige hoy ──
    - cron: "19 12 * * *"  # 08:19 BOT
    - cron: "7 15 * * *"   # 11:07 BOT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tco:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper TCO
        run: python scripts/scrape_tco.py

      # Corre AUNQUE el scraper termine en rojo: el scraper exporta primero y
      # falla después (estancado, formato que cambió, método que no coincide),
      # justamente para que el sitio quede con el mejor dato disponible. Sin esta
      # línea el paso se saltaba y ese dato nunca llegaba a main.
      - name: Commit y push si hay datos nuevos
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Solo commiteamos cuando cambian los datos reales (CSV / raw). El
          # tco.json se regenera con timestamp nuevo en cada corrida, así que se
          # adjunta SOLO cuando ya hay un cambio de datos (evita commits de ruido).
          git add data/tco.csv data/tco_bancos.csv data/tco_raw data/tco_dist
          if git diff --cached --quiet; then
            echo "Sin datos nuevos de TCO."
          else
            git add data/tco.json
            git commit -m "datos: TCO $(date -u +%Y-%m-%d)"
            # El workflow del dólar puede pushear a main a la vez; si el push es
            # rechazado, hacemos rebase sobre origin/main y reintentamos.
            for i in 1 2 3 4 5; do
              if git push; then ok=1; break; fi
              echo "push rechazado (intento $i); rebase y reintento..."
              git pull --rebase origin main || git rebase --abort
              sleep 3
            done
            [ "${ok:-0}" = 1 ] || { echo "push falló tras reintentos"; exit 1; }
          fi
