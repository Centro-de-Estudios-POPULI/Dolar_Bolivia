name: "Actualizar Tipo de Cambio Oficial (TCO)"

on:
  schedule:
    # El BCB publica el reporte del próximo día hábil por la tarde/noche y lo
    # deja estático. El WAF del BCB bloquea (403) de forma intermitente a los
    # runners de GitHub y NO hay backfill: si todas las corridas de un día fallan,
    # el detalle por banco de esa fecha se pierde para siempre. Por eso reintentamos
    # en varias franjas (el scraper es idempotente: corridas extra no duplican).
    - cron: "1 0 * * *"    # 20:01 BOT
    - cron: "1 3 * * *"    # 23:01 BOT
    - cron: "1 6 * * *"    # 02:01 BOT
    - cron: "1 11 * * *"   # 07:01 BOT (red de seguridad matutina)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tco:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper TCO
        run: python scripts/scrape_tco.py

      - name: Commit y push si hay datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Solo commiteamos cuando cambian los datos reales (CSV / raw). El
          # tco.json se regenera con timestamp nuevo en cada corrida, así que se
          # adjunta SOLO cuando ya hay un cambio de datos (evita commits de ruido).
          git add data/tco.csv data/tco_bancos.csv data/tco_raw
          if git diff --cached --quiet; then
            echo "Sin datos nuevos de TCO."
          else
            git add data/tco.json
            git commit -m "datos: TCO $(date -u +%Y-%m-%d)"
            git push
          fi
