name: "Actualizar Tipo de Cambio Oficial (TCO)"

on:
  schedule:
    # 20:01 hora Bolivia (UTC-4) = 00:01 UTC del día siguiente. Todos los días.
    - cron: "1 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tco:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper TCO
        run: python scripts/scrape_tco.py

      - name: Commit y push si hay datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tco.csv data/tco.json
          if git diff --cached --quiet; then
            echo "Sin datos nuevos de TCO."
          else
            git commit -m "datos: TCO $(date -u +%Y-%m-%d)"
            git push
          fi
