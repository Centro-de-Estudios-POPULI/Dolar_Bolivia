name: "Actualizar Tipo de Cambio Oficial (TCO)"

on:
  schedule:
    # El TCO rige el día hábil SIGUIENTE a la sesión que lo fija. El BCB publica el
    # reporte de MAÑANA al cierre de la sesión (~20:00 BOT) y lo deja estático hasta
    # el cierre siguiente; durante la mañana ese mismo reporte es el TCO que rige
    # HOY y se va finalizando. Por eso disparamos en dos franjas clave, con varios
    # intentos cercanos para sortear el WAF 403 y los retrasos de publicación del
    # BCB. El scraper es idempotente + upsert: las corridas extra no duplican,
    # refrescan al valor de cierre y solo commitean si los datos cambian. El
    # endpoint "serie de tiempo" del BCB devuelve TODA la serie por rango, así que
    # cada corrida baja el histórico completo y un día que se pierda se AUTO-RECUPERA
    # en la siguiente corrida que sí pase el WAF (ya no hay pérdida por día suelto).
    #
    # ── Tarde/noche · captura el TCO de MAÑANA apenas se publica (~20:00 BOT) ──
    - cron: "5 0 * * *"    # 20:05 BOT
    - cron: "20 0 * * *"   # 20:20 BOT
    - cron: "45 0 * * *"   # 20:45 BOT
    - cron: "30 1 * * *"   # 21:30 BOT
    - cron: "0 3 * * *"    # 23:00 BOT (red de seguridad nocturna)
    # ── Mañana · confirma/finaliza el TCO VIGENTE de hoy (antes de las 12:00) ──
    - cron: "0 12 * * *"   # 08:00 BOT
    - cron: "0 15 * * *"   # 11:00 BOT
    - cron: "45 15 * * *"  # 11:45 BOT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tco:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper TCO
        run: python scripts/scrape_tco.py

      - name: Commit y push si hay datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Solo commiteamos cuando cambian los datos reales (CSV / raw). El
          # tco.json se regenera con timestamp nuevo en cada corrida, así que se
          # adjunta SOLO cuando ya hay un cambio de datos (evita commits de ruido).
          git add data/tco.csv data/tco_bancos.csv data/tco_raw
          if git diff --cached --quiet; then
            echo "Sin datos nuevos de TCO."
          else
            git add data/tco.json
            git commit -m "datos: TCO $(date -u +%Y-%m-%d)"
            # El workflow del dólar puede pushear a main a la vez; si el push es
            # rechazado, hacemos rebase sobre origin/main y reintentamos.
            for i in 1 2 3 4 5; do
              if git push; then ok=1; break; fi
              echo "push rechazado (intento $i); rebase y reintento..."
              git pull --rebase origin main || git rebase --abort
              sleep 3
            done
            [ "${ok:-0}" = 1 ] || { echo "push falló tras reintentos"; exit 1; }
          fi
