name: "Actualizar precio del dólar"

on:
  schedule:
    # 23:30 BOT = 03:30 UTC (Bolivia es UTC-4), días hábiles lun-vie
    - cron: "30 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar scraper
        run: python scripts/scrape_dolar.py

      - name: Commit y push si hay datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dolar.csv
          if git diff --cached --quiet; then
            echo "Sin datos nuevos."
          else
            git commit -m "datos: dólar $(date -u +%Y-%m-%d)"
            git push
          fi
