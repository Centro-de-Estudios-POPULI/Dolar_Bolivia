name: "Actualizar precio del dólar"

on:
  schedule:
    # Tras el cambio de régimen (jun-2026) el valor referencial del BCB quedó
    # congelado; este workflow ahora solo mantiene viva la serie USDT (paralelo)
    # por fecha de calendario. 1x/día a las 23:00 BOT (captura el día completo).
    # Si el BCB reactivara el referencial, el scraper también lo recogería.
    - cron: "0 3 * * *"   # 23:00 BOT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper
        run: python scripts/scrape_dolar.py

      - name: Commit y push si hay datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dolar.csv data/historico.json data/bancos.json
          if git diff --cached --quiet; then
            echo "Sin datos nuevos."
          else
            git commit -m "datos: dólar $(date -u +%Y-%m-%d)"
            git push
          fi
