name: "Actualizar precio del dólar"

on:
  schedule:
    # Bolivia es UTC-4 — 7 corridas diarias en días hábiles
    - cron: "0 4 * * 1-5"    # 00:00 BOT — medianoche, primer dato USDT del día
    - cron: "0 11 * * 1-5"   # 07:00 BOT — apertura matutina
    - cron: "0 15 * * 1-5"   # 11:00 BOT — media mañana
    - cron: "0 17 * * 1-5"   # 13:00 BOT — mediodía
    - cron: "0 20 * * 1-5"   # 16:00 BOT — tarde
    - cron: "0 23 * * 1-5"   # 19:00 BOT — cierre vespertino
    - cron: "30 3 * * 2-6"   # 23:30 BOT — cierre final (mar-sáb = lun-vie noche)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper
        run: python scripts/scrape_dolar.py

      - name: Commit y push si hay datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dolar.csv data/historico.json data/bancos.json
          if git diff --cached --quiet; then
            echo "Sin datos nuevos."
          else
            git commit -m "datos: dólar $(date -u +%Y-%m-%d)"
            git push
          fi
