<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#A86E00">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tipo de Cambio Oficial y USDT · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
</head>
<body>
  <div class="wrap">
    <!-- Encabezado -->
    <div class="sec-hd">
      <h2 class="sec-title"><span class="accent-bar"></span>Tipo de Cambio Oficial y USDT</h2>
      <p class="sec-sub">Tipo de Cambio Oficial (TCO) del BCB, venta en bancos y USDT Binance P2P · Serie diaria</p>
    </div>

    <!-- Cifras -->
    <div class="kpi-grid" id="kpis"></div>

    <!-- Gráfico + panel -->
    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl">
          <div class="tog-grp" id="pastillas"></div>
          <div class="hz-grp" id="b-rango"></div>
        </div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span>Cargando datos de tipo de cambio…</span></div></div>
        <div class="source">
          <span class="source-txt">Fuente: <a href="https://www.bcb.gob.bo" target="_blank" rel="noopener">BCB</a> · <a href="https://p2p.binance.com" target="_blank" rel="noopener">Binance P2P</a> · Elaboración: <a href="https://populi.org.bo" target="_blank" rel="noopener">Centro de Estudios POPULI</a></span>
          <svg viewBox="0 0 310 130" xmlns="http://www.w3.org/2000/svg" style="height:16px;width:auto;opacity:.18;flex-shrink:0" aria-hidden="true">
            <text x="6" y="112" font-family="'Playfair Display',Georgia,serif" font-size="145" font-weight="700" fill="#C71E1D">P</text>
            <text x="92" y="87" font-family="'Playfair Display',Georgia,serif" font-size="55" font-weight="400" font-style="italic" letter-spacing="1" fill="currentColor">opuli</text>
          </svg>
        </div>
      </div>

      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t">Lectura del indicador</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
        <div class="panel-ft">
          <a href="https://centro-de-estudios-populi.github.io/Dolar_Bolivia/" target="_blank" rel="noopener" class="amp">
            <span>Ampliar análisis</span>
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>
      </div>
    </div>

    <!-- Preguntas -->
    <div class="edu-grid" id="preguntas"></div>
  </div>

  <script>
  (function () {
    var C = PM.C, NB = ' ';
    var BCB_OFICIAL = 6.96;   // tipo de cambio oficial FIJO (Bs/$), nov-2011 → 26-jun-2026
    // TCO turquesa, venta roja, USDT oro (punteada) y la referencia del 6,96 en petróleo, que en
    // tema oscuro sube a menta. Validado con todos los pares: daltonismo ΔE ≥ 12,4 en claro y
    // ≥ 15,4 en oscuro; visión normal ≥ 15,9 y ≥ 19,7.
    var COL = { c: C.turquesa, v: C.rojo, usdt: C.oro, oficial: { claro: C.petroleo, oscuro: C.menta } };
    // La referencia del 6,96 y la marca del cambio de régimen son umbrales: pizarra punteada (regla de la marca)
    var PIZARRA = { claro: C.pizarra, oscuro: '#8A9699' };
    var SERIES = [
      { k: 'c', nombre: 'TCO', color: COL.c, forma: 'linea' },
      { k: 'v', nombre: 'Venta', color: COL.v, forma: 'linea' },
      { k: 'usdt', nombre: 'USDT', color: COL.usdt, forma: 'punteada' }
    ];
    var NOMBRE_VENTA = 'Venta oficial (hasta sep 2026)', NOMBRE_REF = 'Oficial (6,96)';
    var CLAVE = {};                                   // nombre de la serie en el gráfico → color y forma
    CLAVE.TCO = [COL.c, 'linea']; CLAVE[NOMBRE_VENTA] = [COL.v, 'linea']; CLAVE.USDT = [COL.usdt, 'punteada']; CLAVE[NOMBRE_REF] = [PIZARRA, 'punteada'];

    function fbs(v) { return (v == null || isNaN(v)) ? '—' : PM.num(v, 2) + NB + 'Bs'; }
    function fpct(v) { return (v == null || isNaN(v)) ? '—' : PM.pct(v, 1, true); }
    function localDateStr(d) {
      var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), da = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + da;
    }

    // Fusiona la serie referencial (historico.json) con el régimen TCO (tco.json), igual
    // que el dashboard: el TCO de una sesión rige su fecha de VIGENCIA (c = TCO/compra
    // oficial, v = venta oficial = TCO + 0,10 MIENTRAS EXISTIÓ: hasta sep-2026; después
    // cada banco fija la suya y v queda vacío) y se rellenan los findes con carry-forward.
    // Antes del 27-jun-2026 la serie muestra el dólar paralelo referencial.
    function buildSerie(hist, tco) {
      var refSerie = hist.serie || [];
      var gtco = (tco && tco.serie) || [];
      var byDate = new Map(refSerie.map(function (p) { return [p.f, Object.assign({}, p)]; }));
      gtco.forEach(function (t) {
        var dv = t.vig || t.f;
        var ev = byDate.get(dv) || { f: dv };
        ev.c = t.tco; ev.v = t.tco_venta; ev.sesion = t.f;
        ev.sesVol = t.vol; ev.sesTx = t.tx; ev.reg = 'tco'; ev.metodo = t.metodo;
        if (ev.usdt == null) ev.usdt = t.usdt;
        byDate.set(dv, ev);
        var es = byDate.get(t.f) || { f: t.f };
        es.vol = t.vol; es.tx = t.tx;
        if (es.usdt == null) es.usdt = t.usdt;
        byDate.set(t.f, es);
      });
      if (gtco.length) {
        var hoy0 = localDateStr(new Date());
        var nextD = function (iso) { var dd = new Date(iso + 'T00:00:00'); dd.setDate(dd.getDate() + 1); return localDateStr(dd); };
        var ult = null;
        for (var d = gtco[0].vig || gtco[0].f; d <= hoy0; d = nextD(d)) {
          var e = byDate.get(d);
          if (e && e.reg === 'tco' && e.c != null) { ult = e; continue; }
          if (!ult) continue;
          var ev = e || { f: d };
          ev.c = ult.c; ev.v = ult.v; ev.reg = 'tco'; ev.carried = true;
          ev.sesion = ult.sesion; ev.sesVol = ult.sesVol; ev.sesTx = ult.sesTx; ev.metodo = ult.metodo;
          byDate.set(d, ev);
        }
      }
      var serie = Array.from(byDate.values()).sort(function (a, b) { return a.f < b.f ? -1 : (a.f > b.f ? 1 : 0); });
      var regimeTco = gtco.length ? (gtco[0].vig || gtco[0].f) : null;
      var hoyStr = localDateStr(new Date());
      var tcoPts = serie.filter(function (p) { return p.reg === 'tco' && p.c != null && !p.carried; });
      var vigIdx = -1;
      for (var i = 0; i < tcoPts.length; i++) { if (tcoPts[i].f <= hoyStr) vigIdx = i; }
      var vigente = vigIdx >= 0 ? tcoPts[vigIdx] : (tcoPts[tcoPts.length - 1] || hist.hoy || serie[serie.length - 1]);
      var currentPrev = vigIdx > 0 ? tcoPts[vigIdx - 1] : null;
      var conUsdt = serie.slice().reverse().filter(function (p) { return p.usdt != null; })[0];
      var lastUsdt = conUsdt ? conUsdt.usdt : null;
      var current = Object.assign({}, vigente, { f: hoyStr, usdt: vigente.usdt != null ? vigente.usdt : lastUsdt });
      return { serie: serie, regimeTco: regimeTco, current: current, currentPrev: currentPrev };
    }

    function leer(nombre, opcional) {
      var v = new Date().toISOString().slice(0, 10);
      return fetch('../data/' + nombre + '?v=' + v).then(function (r) {
        if (!r.ok) throw new Error(nombre + ': ' + r.status);
        return r.json();
      }).catch(function (e) { if (opcional) return null; throw e; });
    }

    Promise.all([leer('historico.json'), leer('tco.json', true), leer('bancos_tc.json', true)]).then(function (r) {
      var hist = r[0], tco = r[1], btc = r[2];
      var R = buildSerie(hist, tco), serie = R.serie, current = R.current, currentPrev = R.currentPrev, REGIME_TCO = R.regimeTco;
      var N = serie.length;
      if (!N || current.c == null) { PM.error(document.getElementById('chart'), 'Sin datos de tipo de cambio disponibles.'); return; }

      var dev = current.c != null ? (current.c / BCB_OFICIAL - 1) * 100 : null;      // devaluación vs 6,96
      // Venta que publican los bancos hoy (mediana entre bancos): reemplaza a la
      // venta oficial TCO + 0,10, que dejó de existir en sep-2026.
      var ventasB = ((btc && btc.bancos) || []).map(function (b) { return b.venta; }).filter(function (v) { return v != null; }).sort(function (a, b) { return a - b; });
      var ventaBancos = ventasB.length
        ? (ventasB.length % 2 ? ventasB[(ventasB.length - 1) / 2] : (ventasB[ventasB.length / 2 - 1] + ventasB[ventasB.length / 2]) / 2)
        : null;
      // Referencia oficial contra la que se mide el USDT: el TCO en el régimen nuevo.
      var refDe = function (p) { return p ? (p.reg === 'tco' ? p.c : p.v) : null; };
      var devPrev = currentPrev && currentPrev.c != null ? (currentPrev.c / BCB_OFICIAL - 1) * 100 : null;
      var rango = 'todo', si = 0, curIdx = N - 1;
      var activas = new Set(SERIES.map(function (s) { return s.k; }));

      // ── Cifras ─────────────────────────────────────────────────
      function cifras() {
        var pr0 = currentPrev || {};
        // minilíneas: unos 60 días hábiles (sin los fines de semana que la serie rellena); el TCO y su
        // devaluación sólo dentro del régimen TCO. La venta en bancos es un dato de hoy: sin minilínea.
        var habiles = serie.filter(function (p) { return !p.carried; });
        var ult60 = function (f) { return PM.ultimos(habiles.map(f).filter(function (x) { return x != null && !isNaN(x); }), 60); };
        var tcoDe = function (p) { return p.reg === 'tco' ? p.c : null; };
        var kpis = [
          { rotulo: 'TCO · rige hoy', valor: current.c, prev: pr0.c, color: COL.c, serie: ult60(tcoDe) },
          current.v != null
            ? { rotulo: 'Venta oficial', valor: current.v, prev: pr0.v, color: COL.v, serie: ult60(function (p) { return p.reg === 'tco' ? p.v : null; }) }
            : { rotulo: 'Venta en bancos · mediana', valor: ventaBancos, prev: null, color: COL.v },
          { rotulo: 'USDT Binance', valor: current.usdt, prev: pr0.usdt, color: COL.usdt, serie: ult60(function (p) { return p.usdt; }) },
          { rotulo: 'Devaluación vs 6,96', valor: dev, prev: devPrev, color: COL.oficial, esPct: true,
            serie: ult60(function (p) { var c = tcoDe(p); return c == null ? null : (c / BCB_OFICIAL - 1) * 100; }) }
        ];
        document.getElementById('kpis').innerHTML = kpis.map(function (k) {
          var hay = k.prev != null && !isNaN(k.prev) && k.valor != null;
          var d = hay ? (k.valor - k.prev) : 0, plano = !hay || Math.abs(d) < 0.005;
          var delta = !hay ? '— sin sesión previa'
            : PM.flecha(d, 0.005) + ' ' + (k.esPct ? PM.num(Math.abs(d), 1) + NB + 'pp' : PM.num(Math.abs(d), 2) + NB + 'Bs');
          // un dólar más caro es depreciación del boliviano: subir es malo
          return PM.kpi({ color: k.color, rotulo: k.rotulo, valor: k.esPct ? fpct(k.valor) : fbs(k.valor), delta: delta, tono: plano ? 'neutro' : d > 0 ? 'malo' : 'bueno', serie: k.serie });
        }).join('');
      }

      // ── Rango: por días de calendario (la serie rellena los fines de semana) ──
      function desde() {
        if (rango === 'todo') return 0;
        var dias = rango === '1m' ? 31 : 92;
        var u = new Date(serie[N - 1].f + 'T00:00:00');
        u.setDate(u.getDate() - dias);
        var corte = localDateStr(u);
        for (var i = 0; i < N; i++) if (serie[i].f > corte) return i;
        return 0;
      }

      // ── Panel ──────────────────────────────────────────────────
      function panel(idx) {
        if (idx == null || idx < 0 || idx >= N) return;
        curIdx = idx;
        var p = serie[idx], pr = idx > 0 ? serie[idx - 1] : p, isTco = p.reg === 'tco';
        var devPt = p.c != null ? (p.c / BCB_OFICIAL - 1) * 100 : null;
        var prima = (p.usdt != null && refDe(p) != null) ? p.usdt - refDe(p) : null;   // USDT sobre el TCO (antes del 26-jun, sobre la venta referencial)
        var dC = (p.c != null && pr.c != null) ? p.c - pr.c : null;
        document.getElementById('panel-fecha').textContent = PM.fecha(p.f) + (p.carried ? ' · vigente' : '');
        var tDev = PM.dt(COL.oficial, fpct(devPt)), txt;
        if (devPt == null) txt = 'Punto del <strong>mercado paralelo referencial</strong>, antes del estreno del Tipo de Cambio Oficial flexible (27 de junio de 2026).';
        else if (devPt > 38) txt = 'Frente al tipo de cambio oficial fijo de <strong>Bs 6,96</strong> (ancla nominal 2011–2026), el TCO implica una devaluación de ' + tDev + '. El abandono del tipo fijo reconoce el agotamiento de las reservas y la presión cambiaria acumulada; el nuevo régimen busca que el precio del dólar refleje la oferta y demanda reales.';
        else if (devPt > 20) txt = 'El TCO se ubica ' + tDev + ' por encima del viejo tipo fijo de <strong>Bs 6,96</strong>. La devaluación implícita traslada a precios la escasez de divisas que el mercado paralelo ya anticipaba.';
        else txt = 'El TCO está ' + tDev + ' respecto al tipo fijo de <strong>Bs 6,96</strong>.';
        var descC = isTco
          ? (p.metodo === 'mediana' ? 'Mediana ponderada' : 'Promedio ponderado') + ' por monto de las <strong>compras de dólares de la banca</strong> el <strong>' + PM.fecha(p.sesion || p.f) +
            '</strong>; rige como referencia el <strong>' + PM.fecha(p.f) + '</strong>.' +
            (dC != null ? ' Variación de ' + PM.dt(COL.c, PM.signo(dC, 2) + NB + 'Bs') + ' vs. la sesión anterior.' : '')
          : 'Precio de <strong>compra</strong> del dólar en el mercado paralelo referencial.';
        var descV = !isTco ? 'Precio de <strong>venta</strong> del dólar en el mercado paralelo referencial.'
          : (p.v != null
            ? 'Tope de <strong>venta al público</strong> fijado por el BCB hasta el 24 de septiembre de 2026 (valor referencial de venta): TCO + <strong>0,10 Bs</strong>.'
            : 'Desde fines de septiembre de 2026 cada banco fija y publica su propio precio de venta. Mediana de lo publicado hoy' +
              (ventasB.length ? ' por ' + ventasB.length + ' bancos (entre ' + fbs(ventasB[0]) + ' y ' + fbs(ventasB[ventasB.length - 1]) + ')' : '') + '.');
        var descU = p.usdt == null ? 'Sin dato de USDT para esta fecha.'
          : (prima == null ? 'Mediana del USDT/BOB en Binance P2P.'
            : 'Mediana del USDT/BOB en Binance P2P — cotiza ' + PM.dt(COL.usdt, PM.signo(prima, 2) + NB + 'Bs') + ' ' +
              (Math.abs(prima) < 0.15 ? 'prácticamente en línea con' : (prima >= 0 ? 'por encima de' : 'por debajo de')) + ' ' + (isTco ? 'el TCO' : 'la venta referencial') + '.');
        document.getElementById('panel').innerHTML =
          PM.pb(COL.c, isTco ? 'Tipo de Cambio Oficial' : 'Compra (paralelo)', fbs(p.c), descC) +
          PM.pb(COL.v, !isTco ? 'Venta (paralelo)' : (p.v != null ? 'Venta oficial' : 'Venta en bancos'), fbs(isTco && p.v == null ? ventaBancos : p.v), descV) +
          PM.pb(COL.usdt, 'USDT Binance P2P', fbs(p.usdt), descU) +
          PM.ctx(txt);
      }

      // ── Gráfico ────────────────────────────────────────────────
      function opciones() {
        si = desde();
        var V = serie.slice(si), K = V.map(function (d) { return d.f; }), dk = PM.dk(), series = [];
        function linea(clave, nombre, color, ancho, punteada, area) {
          var vals = V.map(function (d) { return d[clave] == null ? null : d[clave]; });
          var n = -1;
          for (var i = vals.length - 1; i >= 0; i--) if (vals[i] != null) { n = i; break; }
          var o = PM.linea(color, { ancho: ancho, punteada: punteada, extra: {
            name: nombre, data: vals, connectNulls: false, z: 3,
            markPoint: n >= 0 ? PM.puntoFinal(color, n, vals[n]) : undefined
          } });
          if (area) o.areaStyle = { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: PM.rgba(color, dk ? 0.16 : 0.12) }, { offset: 1, color: PM.rgba(color, 0) }]) };
          return o;
        }
        // protagonista el TCO (2,5 px y único relleno); venta y USDT, 1,75 px
        if (activas.has('c')) series.push(linea('c', 'TCO', COL.c, 2.5, false, true));
        if (activas.has('v')) series.push(linea('v', NOMBRE_VENTA, COL.v, 1.75, false, false));
        if (activas.has('usdt')) series.push(linea('usdt', 'USDT', COL.usdt, 1.75, true, false));
        // Línea de referencia del tipo fijo 6,96 + marca del cambio de régimen: umbrales en pizarra, 1,25 px
        var ref = PM.linea(PIZARRA, { ancho: 1.25, punteada: true, extra: { name: NOMBRE_REF, data: K.map(function () { return BCB_OFICIAL; }), symbol: 'none', z: 1 } });
        if (REGIME_TCO && K.indexOf(REGIME_TCO) >= 0) ref.markLine = {
          silent: true, symbol: 'none', animation: false,
          lineStyle: { color: PM.col(PIZARRA), type: 'dashed', width: 1.25 },
          label: { show: true, formatter: 'Cambio de régimen · TCO', position: 'end', distance: 6, fontFamily: 'Inter', fontSize: 9.5, fontWeight: 600, color: PM.tx(PIZARRA) },
          data: [{ xAxis: REGIME_TCO }]
        };
        series.push(ref);
        var el = document.getElementById('chart');
        return {
          grid: PM.grid({ top: 30 }),
          xAxis: PM.ejeTiempo(K, el),
          // piso entero que incluye el viejo 6,96: los cortes caen en bolivianos enteros, sin rótulo doble en el borde
          yAxis: PM.ejeY({ unidad: 'Bs', extra: { min: function (v) { return Math.floor(Math.min(v.min, BCB_OFICIAL) - 0.3); } } }),
          tooltip: PM.tooltip(function (ps) {
            if (!ps.length) return '';
            var i = ps[0].dataIndex;
            panel(si + i);
            var h = PM.ttTitulo(PM.fecha(K[i])), tco = V[i].reg === 'tco';
            // antes del 27 de junio de 2026 la serie es el paralelo referencial: se nombra como en el panel
            var rotulo = { TCO: tco ? 'TCO' : 'Compra (paralelo)' };
            rotulo[NOMBRE_VENTA] = tco ? 'Venta oficial' : 'Venta (paralelo)';
            ps.forEach(function (p) {
              if (p.value == null) return;
              var c = CLAVE[p.seriesName] || [COL.oficial, 'linea'];
              h += PM.ttFila(c[0], rotulo[p.seriesName] || p.seriesName, fbs(p.value), c[1]);
            });
            return h;
          }),
          series: series
        };
      }

      // ── Preguntas (con cifras de hoy; se rehacen con el tema y conservan las abiertas) ──
      var primaHoy = (current.usdt != null && current.c != null) ? current.usdt - current.c : null;   // USDT sobre el TCO
      function preguntas() {
        var el = document.getElementById('preguntas');
        var abiertas = [].map.call(el.querySelectorAll('.edu'), function (e) { return e.classList.contains('open'); });
        PM.preguntas(el, [
          ['¿Qué es el Tipo de Cambio Oficial (TCO)?', '<p>Desde el <strong>27 de junio de 2026</strong>, el <strong>Banco Central de Bolivia (BCB)</strong> reemplazó el tipo de cambio fijo por el <strong>Tipo de Cambio Oficial (TCO)</strong>, que resume las <strong>operaciones de compra de dólares de la banca</strong>: desde la sesión del 25 de septiembre es su <strong>mediana ponderada por monto</strong> (antes, el promedio ponderado). El BCB lo publica a las 23:30 y rige como referencia desde el día siguiente (R.D. 142/2026).</p>' +
            '<p>Hasta el 24 de septiembre la venta tenía un <strong>tope oficial</strong> de TCO más ' + PM.dt(COL.v, '0,10' + NB + 'Bs') + '; la R.D. 142/2026 lo eliminó y desde entonces cada banco fija y publica su propia venta. Hoy el TCO rige en ' + PM.dt(COL.c, fbs(current.c)) +
            (ventaBancos != null ? ' y la venta que publican los bancos tiene una mediana de ' + PM.dt(COL.v, fbs(ventaBancos)) : '') + '.</p>'],
          ['El fin del tipo fijo de Bs 6,96', '<p>Entre <strong>noviembre de 2011 y junio de 2026</strong>, el boliviano estuvo anclado a un tipo de cambio fijo de ' + PM.dt(COL.oficial, 'Bs' + NB + '6,96') + ' por dólar. Ese ancla nominal buscaba estabilidad de precios, pero exigía reservas suficientes para vender dólares a ese precio.</p>' +
            '<p>Agotadas las reservas, el BCB abandonó el tipo fijo. El TCO arrancó en <strong>Bs 9,73</strong> y hoy implica una <strong>devaluación de ' + PM.dt(COL.oficial, fpct(dev)) + '</strong> frente al viejo 6,96.</p>'],
          ['¿Qué es el USDT y por qué importa?', '<p>El <strong>USDT (Tether)</strong> es una criptomoneda estable vinculada 1:1 al dólar. En Bolivia se negocia en <strong>Binance P2P</strong> y funciona como un <strong>«dólar digital»</strong> cuyo precio refleja la demanda real de divisas.</p>' +
            '<p>Hoy cotiza en ' + PM.dt(COL.usdt, fbs(current.usdt)) + ', ' + (primaHoy == null ? 'sin comparación disponible con el TCO.'
              : (Math.abs(primaHoy) < 0.15 ? 'prácticamente en línea con el TCO — ambos mercados convergen.'
                : primaHoy >= 0 ? '<strong>' + PM.num(primaHoy, 2) + NB + 'Bs por encima</strong> del TCO, señal de que aún hay presión de demanda.'
                : '<strong>' + PM.num(Math.abs(primaHoy), 2) + NB + 'Bs por debajo</strong> del TCO.')) + '</p>'],
          ['¿Por qué se disparó el precio del dólar?', '<p>La escasez de divisas tiene raíz <strong>fiscal y monetaria</strong>: la caída sostenida de las <strong>reservas internacionales</strong> dejó al BCB sin capacidad de sostener el tipo fijo, mientras el financiamiento del déficit público presionaba la demanda de dólares.</p>' +
            '<p>El TCO flexible traslada esa presión al precio de forma explícita, en lugar de contenerla con un mercado paralelo cada vez más amplio. Es un cambio de régimen, no un ajuste puntual.</p>']
        ]);
        abiertas.forEach(function (a, i) {
          var e = el.children[i];
          if (a && e) { e.classList.add('open'); e.querySelector('.edu-t').setAttribute('aria-expanded', 'true'); }
        });
      }

      // ── Montaje ────────────────────────────────────────────────
      cifras();
      PM.pastillas(document.getElementById('pastillas'), SERIES, activas, function () { grafico.redibujar(); });
      PM.botonera(document.getElementById('b-rango'), [['1m', '1 mes'], ['3m', '3 meses'], ['todo', 'Todo']], rango,
        function (v) { rango = v; grafico.redibujar(); });
      var el = document.getElementById('chart');
      el.innerHTML = '';
      var grafico = PM.montar(el, opciones);
      grafico.chart.on('click', function (p) { if (p.dataIndex != null) panel(si + p.dataIndex); });
      panel(N - 1);
      preguntas();
      PM.alCambiarTema(function () { cifras(); panel(curIdx); preguntas(); });
    }).catch(function (e) { console.error(e); PM.error(document.getElementById('chart'), 'Error al cargar datos. Intente recargar.'); });
  })();
  </script>
